name: Feature request
description: Suggest a focused change to Copy All Note.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What is awkward today
      description: Explain the problem without private note text or vault details.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you want it to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you already tried

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about copying the current note, not vault-wide automation.
          required: true
