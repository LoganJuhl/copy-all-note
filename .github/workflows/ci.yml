name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22.22.2"
          - "24"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint, typecheck, test, and build
        run: npm run check

      - name: Verify a repeatable production bundle
        shell: bash
        run: |
          first_hash="$(sha256sum main.js | cut -d ' ' -f 1)"
          node esbuild.config.mjs production
          second_hash="$(sha256sum main.js | cut -d ' ' -f 1)"
          test "$first_hash" = "$second_hash"

      - name: Assemble runtime files
        run: npm run release:package
